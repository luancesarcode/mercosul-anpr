name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou melhoria de experiência.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual necessidade de usuário esta proposta resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
      description: Descreva o comportamento desejado sem depender de uma implementação específica.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: checkboxes
    id: scope
    attributes:
      label: Escopo
      options:
        - label: Consultei o roadmap e não encontrei uma entrega equivalente.
          required: true
